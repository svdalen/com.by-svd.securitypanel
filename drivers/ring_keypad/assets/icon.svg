<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <!-- Ring Keypad: portrait keypad with three mode keys above a 3x4 grid, seen from the right. Line drawing, full 960 canvas. -->
  <g fill="none" stroke="#000" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <!-- side and top faces -->
    <path d="M688 118 l64 -40 v728 l-64 40"/>
    <path d="M280 118 l64 -40 h408"/>
    <!-- front face -->
    <rect x="208" y="118" width="480" height="728" rx="72"/>
    <!-- light bar -->
    <path d="M328 196 h240"/>
    <!-- mode keys -->
    <rect x="276" y="264" width="100" height="84" rx="22"/>
    <rect x="398" y="264" width="100" height="84" rx="22"/>
    <rect x="520" y="264" width="100" height="84" rx="22"/>
    <!-- number keys -->
    <g stroke-width="38">
    <circle cx="326" cy="440" r="38"/><circle cx="448" cy="440" r="38"/><circle cx="570" cy="440" r="38"/>
    <circle cx="326" cy="548" r="38"/><circle cx="448" cy="548" r="38"/><circle cx="570" cy="548" r="38"/>
    <circle cx="326" cy="656" r="38"/><circle cx="448" cy="656" r="38"/><circle cx="570" cy="656" r="38"/>
    <path d="M304 742 l44 44 M348 742 l-44 44"/>
    <circle cx="448" cy="764" r="38"/>
    <path d="M546 766 l16 16 l34 -36"/>
    </g>
  </g>
</svg>
