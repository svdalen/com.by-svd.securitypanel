<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <!-- Security panel: wall-mounted panel with a screen, seen from the right. Line drawing, full 960 canvas. -->
  <g fill="none" stroke="#000" stroke-width="48" stroke-linecap="round" stroke-linejoin="round">
    <!-- side and bottom faces -->
    <path d="M740 212 l76 -44 v524 l-76 44"/>
    <path d="M204 212 l76 -44 h536"/>
    <!-- front face -->
    <rect x="148" y="212" width="592" height="548" rx="56"/>
    <!-- screen -->
    <rect x="224" y="288" width="440" height="252" rx="28"/>
    <!-- buttons -->
    <rect x="236" y="604" width="104" height="72" rx="20"/>
    <rect x="392" y="604" width="104" height="72" rx="20"/>
    <rect x="548" y="604" width="104" height="72" rx="20"/>
  </g>
  <!-- status light -->
  <circle cx="444" cy="716" r="18" fill="#000"/>
</svg>
