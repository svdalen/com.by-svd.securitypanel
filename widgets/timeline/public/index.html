<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    :root {
      --tl-armed: var(--homey-color-red, #ff3b30);
      --tl-partial: var(--homey-color-orange, #ff9500);
      --tl-ok: var(--homey-color-green, #34c759);
      --tl-line: rgba(120, 120, 128, .3);
      --tl-row: rgba(120, 120, 128, .14);
      --tl-radius: var(--homey-border-radius-default, 12px);
      --tl-fs-small: var(--homey-font-size-small, 12px);
      --tl-fs-default: var(--homey-font-size-default, 14px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body { margin: 0; color: var(--homey-text-color, inherit); overscroll-behavior: contain; }
    svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* Fixed height from the settings; the entries scroll inside, with a slim
       pager at the bottom. */
    .wrap { height: 100%; display: flex; flex-direction: column; user-select: none; }
    .tl { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; position: relative; padding: 2px 0; }

    /* A text timeline: time | line with a dot | header + subheader */
    .ev { display: grid; grid-template-columns: 42px 18px 1fr; column-gap: 8px; align-items: start; position: relative; padding: 5px 0; }
    .ev-time { font-size: var(--tl-fs-small); font-variant-numeric: tabular-nums; opacity: .6; text-align: right; line-height: 1.25; padding-top: 1px; }
    .ev-line { position: relative; align-self: stretch; }
    .ev-line::before { content: ''; position: absolute; left: 9px; top: -9px; bottom: -9px; width: 1.5px; background: var(--tl-line); }
    .ev.first .ev-line::before { top: 10px; }
    .ev.last .ev-line::before { bottom: auto; height: 100%; }
    .ev-dot { position: relative; z-index: 1; width: 10px; height: 10px; margin: 5px 0 0 4px; border-radius: 50%; background: var(--tl-ok); }
    .ev.open .ev-dot { background: var(--tl-partial); }
    .ev.tamper.open .ev-dot, .ev.alarm .ev-dot, .ev.entry .ev-dot, .ev.armed .ev-dot { background: var(--tl-armed); }
    .ev.partially_armed .ev-dot { background: var(--tl-partial); }
    .ev.sys .ev-dot { width: 8px; height: 8px; margin: 6px 0 0 5px; }
    .ev-body { min-width: 0; line-height: 1.25; position: relative; z-index: 1; }
    .ev-head { font-size: var(--tl-fs-default); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ev-sub { font-size: var(--tl-fs-small); opacity: .6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ev-sub b { font-weight: 600; opacity: 1; }
    .ev.open .ev-sub b { color: #b86a00; }
    .homey-dark-mode .ev.open .ev-sub b, body.homey-dark-mode .ev.open .ev-sub b { color: #ffb340; }
    .ev.tamper.open .ev-sub b, .ev.alarm .ev-head, .ev.entry .ev-head { color: var(--tl-armed); }
    .ev.sys .ev-head { font-weight: 500; opacity: .85; }
    .ev.armed .ev-head { color: var(--tl-armed); }
    .ev.partially_armed .ev-head { color: var(--tl-partial); }
    .ev.disarmed .ev-head, .ev.alarm_ended .ev-head { color: var(--tl-ok); }
    /* an alarm episode gets a faint red band from the trip to "alarm ended" */
    .ev.episode::after { content: ''; position: absolute; left: 68px; right: 0; top: 0; bottom: 0; border-radius: 8px; background: rgba(255, 59, 48, .08); z-index: 0; }
    .ev.episode.ep-first::after { border-bottom-left-radius: 0; border-bottom-right-radius: 0; bottom: -6px; }
    .ev.episode.ep-mid::after { border-radius: 0; top: -6px; bottom: -6px; }
    .ev.episode.ep-last::after { border-top-left-radius: 0; border-top-right-radius: 0; top: -6px; }

    .day { display: grid; grid-template-columns: 42px 18px 1fr; column-gap: 8px; padding: 8px 0 2px; }
    .day span { grid-column: 3; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .5; }

    .tl-note {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; padding: 8px 12px; margin: 2px 0;
      border-radius: var(--tl-radius); background: var(--tl-row);
      font-size: var(--tl-fs-small); opacity: .75; text-align: center;
    }
    .tl-note svg { width: 18px; height: 18px; flex: 0 0 auto; }
    .wrap[data-mode="armed"] .tl-note svg { color: var(--tl-armed); }
    .wrap[data-mode="partially_armed"] .tl-note svg { color: var(--tl-partial); }

    /* Slim pager: one 18px line, only when the list overflows */
    .pager { display: none; flex: 0 0 auto; height: 18px; align-items: center; justify-content: center; gap: 4px; font-size: 11px; opacity: .6; cursor: pointer; }
    .pager.show { display: flex; }
    .pager svg { width: 12px; height: 12px; stroke-width: 2.5; }
  </style>
</head>
<body class="homey-widget">
  <div class="wrap" id="wrap" data-mode="disarmed">
    <div class="tl" id="tl"></div>
    <div class="pager" id="pager"></div>
  </div>

  <script>
    (function () {
      var H = null;
      var settings = {};
      var data = null;
      var ticker = null;
      var lastVersion = null; // status.eventsVersion of the log we hold

      /* shared:start */
      /* Shared client helpers for the dashboard widgets. Homey serves each widget
         folder on its own, so this file is inlined into every widget's index.html
         between the "shared:start" and "shared:end" markers by `npm run widgets`.
         Edit here, never in the widgets. The widget declares `H` (the Homey client)
         before this block. */
      var MOTION_LIKE = { alarm_motion: 1, alarm_occupancy: 1, alarm_presence: 1 };

      // Inline icons (Feather-style strokes), coloured through CSS.
      var ICONS = {
        shield: '<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
        shieldCheck: '<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>',
        home: '<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>',
        homePlain: '<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
        unlock: '<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>',
        bell: '<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
        bellOff: '<svg viewBox="0 0 24 24"><path d="M13.7 21a2 2 0 0 1-3.4 0"/><path d="M18.6 13A17.9 17.9 0 0 1 18 8"/><path d="M6.3 6.3A6 6 0 0 0 6 8c0 7-3 9-3 9h14"/><path d="M18 8a6 6 0 0 0-9.3-5"/><line x1="1" y1="1" x2="23" y2="23"/></svg>',
        x: '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
        back: '<svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
        check: '<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>',
        down: '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
        up: '<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',
        alert: '<svg viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12" y2="17"/></svg>',
        door: '<svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V5a2 2 0 0 1 2-2h7v18"/><path d="M14 3h3a2 2 0 0 1 2 2v16"/><circle cx="11" cy="12" r="1"/></svg>',
        motion: '<svg viewBox="0 0 24 24"><path d="M12 2a4 4 0 0 1 4 4v1H8V6a4 4 0 0 1 4-4z"/><path d="M4 22l3-9h10l3 9"/><path d="M9 13l-1 9M15 13l1 9"/></svg>',
        sensor: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
        eyeOff: '<svg viewBox="0 0 24 24"><path d="M17.9 17.9A10 10 0 0 1 12 20c-7 0-11-8-11-8a18 18 0 0 1 5.1-6M9.9 4.2A9 9 0 0 1 12 4c7 0 11 8 11 8a18 18 0 0 1-2.2 3.2"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/><line x1="1" y1="1" x2="23" y2="23"/></svg>',
      };

      /** Translation lookup for one namespace of locales/<lang>.json, with a fallback. */
      function makeT(ns) {
        return function (key, fallback) {
          try {
            var s = H.__(ns + '.' + key);
            return (s && s !== ns + '.' + key) ? s : fallback;
          } catch (e) { return fallback; }
        };
      }

      /** Icon for a sensor row by capability. */
      function iconFor(s) {
        if (MOTION_LIKE[s.capability]) return ICONS.motion;
        if (s.capability === 'alarm_contact') return ICONS.door;
        return s.capability === 'alarm_tamper' ? ICONS.alert : ICONS.sensor;
      }

      // Fold each device's tamper row into its main row (same deviceId); a device
      // that only has a tamper capability keeps its own row. Returns new objects,
      // the status rows themselves are left alone.
      function groupRows(all) {
        var byDev = {}, out = [];
        all.forEach(function (s) {
          if (s.capability === 'alarm_tamper') return;
          var row = Object.assign({}, s, { tamper: null });
          out.push(row);
          if (row.deviceId && !byDev[row.deviceId]) byDev[row.deviceId] = row;
        });
        all.forEach(function (s) {
          if (s.capability !== 'alarm_tamper') return;
          var main = s.deviceId && byDev[s.deviceId];
          if (!main) { out.push(Object.assign({}, s, { tamper: null })); return; }
          if (!main.tamper || (s.enabled && s.active)) main.tamper = s;
        });
        return out;
      }
      function tampered(s) { return Boolean(s.tamper && s.tamper.enabled && s.tamper.active); }

      /** The zone chosen in the widget's autocomplete setting, or null for all. */
      function zoneFilter(settings) {
        var z = settings && settings.zone;
        if (!z) return null;
        var id = typeof z === 'object' ? z.id : z;
        return id ? String(id) : null;
      }

      /** Elapsed-time texts in the two largest units: "45 s", "12 min", "3 h 10 min", "5 d 3 h". */
      function makeElapsed(t) {
        function elapsed(ts) {
          var s = Math.max(0, Math.round((Date.now() - ts) / 1000));
          var m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
          if (s < 60) return s + ' s';
          if (m < 60) return m + ' ' + t('min', 'min');
          if (h < 24) return h + ' ' + t('h', 'h') + (m % 60 ? ' ' + (m % 60) + ' ' + t('min', 'min') : '');
          return d + ' ' + t('d', 'd') + (h % 24 ? ' ' + (h % 24) + ' ' + t('h', 'h') : '');
        }
        return {
          elapsed: elapsed,
          since: function (ts) { return t('since', 'since') + ' ' + elapsed(ts); },
          ago: function (ts) { return Date.now() - ts < 60000 ? t('just_now', 'just now') : elapsed(ts) + ' ' + t('ago', 'ago'); },
        };
      }

      // A slim line under a scrolling list pages through it: "v 3 more" / "^ back
      // to top". Returns the refresh function; call it after every render.
      function makePager(container, pagerEl, t, itemSelector) {
        function items() { return itemSelector ? container.querySelectorAll(itemSelector) : container.children; }
        function atEnd() { return container.scrollTop + container.clientHeight >= container.scrollHeight - 2; }
        function update() {
          var overflow = container.scrollHeight > container.clientHeight + 2;
          if (!overflow) { pagerEl.classList.remove('show'); return; }
          var list = items(), below = 0;
          for (var i = 0; i < list.length; i++) {
            if (list[i].offsetTop + list[i].offsetHeight > container.scrollTop + container.clientHeight + 1) below += 1;
          }
          var end = atEnd();
          pagerEl.innerHTML = (end ? ICONS.up : ICONS.down) + '<span></span>';
          pagerEl.querySelector('span').textContent = end ? t('top', 'back to top') : below + ' ' + t('more', 'more');
          pagerEl.classList.add('show');
        }
        pagerEl.addEventListener('click', function () {
          var end = atEnd();
          try {
            if (end) container.scrollTo({ top: 0, behavior: 'smooth' });
            else container.scrollBy({ top: Math.max(40, container.clientHeight - 24), behavior: 'smooth' });
          } catch (e) { container.scrollTop = end ? 0 : container.scrollTop + container.clientHeight - 24; }
          setTimeout(update, 350);
        });
        var timer = null;
        container.addEventListener('scroll', function () { clearTimeout(timer); timer = setTimeout(update, 80); });
        return update;
      }
      /* shared:end */
      var wrap = document.getElementById('wrap'), tl = document.getElementById('tl'), pager = document.getElementById('pager');

      var t = makeT('timeline_widget');


      function pad(n) { return (n < 10 ? '0' : '') + n; }
      function dayKey(ts) { return new Date(ts).toDateString(); }
      function dayLabel(ts) {
        var d = new Date(ts), now = new Date();
        if (d.toDateString() === now.toDateString()) return t('today', 'Today');
        var y = new Date(now); y.setDate(now.getDate() - 1);
        if (d.toDateString() === y.toDateString()) return t('yesterday', 'Yesterday');
        try { return d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' }); } catch (e) { return pad(d.getDate()) + '/' + pad(d.getMonth() + 1); }
      }
      function timeLabel(ts) { var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

      function selected() {
        var events = data && Array.isArray(data.events) ? data.events : [];
        var zone = zoneFilter(settings);
        var win = settings.window || '30';
        var since = win === '1h' ? Date.now() - 3600000 : win === '24h' ? Date.now() - 86400000 : 0;
        var out = [], sensors = 0;
        for (var i = 0; i < events.length; i++) {
          var e = events[i];
          if (since && e.at < since) break; // newest first
          if (e.type === 'sensor') {
            if (zone && e.zone !== zone) continue;
            sensors += 1;
          } else if (settings.showSystem === false) {
            continue;
          }
          out.push(e);
          if (win === '30' && sensors >= 30) break;
        }
        return out;
      }

      // Mark the entries of an alarm episode: from "alarm ended" (newest) down
      // to the entry/alarm marker and the sensor trip right after it.
      function markEpisodes(list) {
        var inEp = false;
        for (var i = 0; i < list.length; i++) {
          var e = list[i];
          e.episode = false;
          if (e.type === 'alarm_ended') { inEp = true; e.episode = true; continue; }
          if (inEp) {
            e.episode = true;
            if (e.type === 'entry' || (e.type === 'alarm' && !(list[i + 1] && list[i + 1].type === 'entry'))) {
              var next = list[i + 1];
              if (next && next.type === 'sensor' && next.active) { next.episode = true; i += 1; }
              inEp = false;
            }
          } else if (e.type === 'alarm' || e.type === 'entry') {
            e.episode = true; // still running: no "alarm ended" yet
            var nx = list[i + 1];
            if (nx && nx.type === 'sensor' && nx.active) { nx.episode = true; i += 1; }
          }
        }
      }

      function sysLabel(e) {
        if (e.type === 'mode') return t(e.mode, e.mode);
        if (e.type === 'entry') return t('entry', 'Alarm pending') + (e.name ? ' · ' + e.name : '');
        if (e.type === 'alarm') return t('alarm', 'Alarm') + (e.name ? ' · ' + e.name : '');
        return t('alarm_ended', 'Alarm ended');
      }
      function stateText(e) {
        if (e.capability === 'alarm_tamper') return e.active ? t('tamper', 'Tamper') : t('tamper_ok', 'Tamper cleared');
        var motion = MOTION_LIKE[e.capability];
        return e.active ? (motion ? t('motion', 'Motion') : t('open', 'Open')) : (motion ? t('clear', 'Clear') : t('closed', 'Closed'));
      }

      function note(icon, text) {
        var n = document.createElement('div');
        n.className = 'tl-note';
        n.innerHTML = (icon || '') + '<span></span>';
        n.querySelector('span').textContent = text;
        tl.appendChild(n);
      }

      function render() {
        tl.innerHTML = '';
        if (!data) return;
        wrap.setAttribute('data-mode', data.mode);
        if (settings.hideWhenArmed !== false && data.mode !== 'disarmed') {
          note(ICONS.eyeOff, t('hidden_armed', 'The timeline is hidden while the alarm is armed'));
          updatePager();
          return;
        }
        var list = selected();
        if (!list.length) { note('', t('no_events', 'No changes yet since the app started')); updatePager(); return; }
        markEpisodes(list);
        var showZone = !zoneFilter(settings);
        var lastDay = null, rowsEls = [];
        list.forEach(function (e, idx) {
          var dk = dayKey(e.at);
          if (dk !== lastDay) {
            lastDay = dk;
            var day = document.createElement('div');
            day.className = 'day';
            day.innerHTML = '<span></span>';
            day.querySelector('span').textContent = dayLabel(e.at);
            tl.appendChild(day);
            if (rowsEls.length) rowsEls[rowsEls.length - 1].classList.add('last');
            rowsEls = [];
          }
          var row = document.createElement('div');
          var head, sub;
          if (e.type === 'sensor') {
            var tamper = e.capability === 'alarm_tamper';
            row.className = 'ev' + (e.active ? ' open' : '') + (tamper ? ' tamper' : '');
            head = e.name + (tamper ? ' · ' + t('tamper', 'Tamper') : '');
            sub = '<b></b>' + (showZone && e.zone ? ' · <span></span>' : '');
          } else {
            row.className = 'ev sys ' + (e.type === 'mode' ? e.mode : e.type);
            head = sysLabel(e);
            sub = '';
          }
          if (e.episode) {
            var prevEp = idx > 0 && list[idx - 1].episode && dayKey(list[idx - 1].at) === dk;
            var nextEp = idx < list.length - 1 && list[idx + 1].episode && dayKey(list[idx + 1].at) === dk;
            row.className += ' episode ' + (prevEp && nextEp ? 'ep-mid' : prevEp ? 'ep-last' : nextEp ? 'ep-first' : '');
          }
          if (!rowsEls.length) row.className += ' first';
          row.innerHTML = '<span class="ev-time"></span><span class="ev-line"><span class="ev-dot"></span></span>' +
            '<span class="ev-body"><div class="ev-head"></div>' + (sub ? '<div class="ev-sub">' + sub + '</div>' : '') + '</span>';
          row.querySelector('.ev-time').textContent = timeLabel(e.at);
          row.querySelector('.ev-head').textContent = head;
          if (e.type === 'sensor') {
            row.querySelector('.ev-sub b').textContent = stateText(e);
            if (showZone && e.zone) row.querySelector('.ev-sub span').textContent = e.zone;
          }
          tl.appendChild(row);
          rowsEls.push(row);
        });
        if (rowsEls.length) rowsEls[rowsEls.length - 1].classList.add('last');
        updatePager();
      }

      var updatePager = makePager(tl, pager, t, '.ev');

      function load() {
        return H.api('GET', '/events', {}).then(function (d) { data = d; render(); }).catch(function () {});
      }

      window.onHomeyReady = function (Homey) {
        H = Homey;
        try { settings = Homey.getSettings() || {}; } catch (e) { settings = {}; }
        var height = parseInt(settings.height, 10) || 300;
        // A status push carries the event log version: refetch only when it
        // moved; otherwise just follow the mode (the hide-while-armed rule).
        Homey.on('status', function (s) {
          if (!s) return;
          var v = s.eventsVersion;
          if (v === undefined || v !== lastVersion) { lastVersion = v; load(); return; }
          if (data && data.mode !== s.mode) { data.mode = s.mode; render(); }
        });
        clearInterval(ticker);
        ticker = setInterval(render, 60000); // day labels and the time window move on
        load().then(function () { Homey.ready({ height: height }); setTimeout(updatePager, 50); });
      };
    })();
  </script>
</body>
</html>
