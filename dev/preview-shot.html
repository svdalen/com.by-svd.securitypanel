<!DOCTYPE html>
<!-- Store preview harness: one widget as a dashboard tile, centred on a
     transparent 512x512 page (rendered at 2x = 1024x1024).
     ?widget=keypad|sensors|timeline&state=...&dark=1 -->
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .tile { width: 400px; height: 440px; border-radius: 28px; background: #ffffff; box-shadow: 0 18px 40px rgba(0,0,0,.22); padding: 10px; overflow: hidden; }
  body.dark .tile { background: #1c1c1e; box-shadow: 0 18px 40px rgba(0,0,0,.6); }
  body.bare .tile { background: transparent; box-shadow: none; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: transparent; }
</style></head>
<body>
<div class="tile"><iframe id="f"></iframe></div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var widget = q.get('widget') || 'keypad';
  var dark = q.get('dark') === '1';
  if (dark) document.body.classList.add('dark');
  var pages = { keypad: 'widget-shot.html', sensors: 'sensors-shot.html', timeline: 'timeline-shot.html' };
  var params = new URLSearchParams();
  q.forEach(function (v, k) { if (k !== 'widget') params.set(k, v); });
  if (widget === 'sensors' && !params.get('height')) params.set('height', '420');
  if (widget === 'timeline' && !params.get('height')) params.set('height', '420');
  if (widget === 'timeline') params.set('transparent', '1');
  document.getElementById('f').src = pages[widget] + '?' + params.toString();
})();
</script>
</body></html>
