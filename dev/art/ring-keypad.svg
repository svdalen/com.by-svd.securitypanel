<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Ring-style alarm keypad, drawn for this app: angled from the right with a visible side, shading and a soft shadow. -->
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9e9ee"/></linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eeeef2"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#5ac8fa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity=".12"/></filter>
  </defs>
  <!-- shadow on the wall -->
  <ellipse cx="214" cy="340" rx="118" ry="22" fill="#000" opacity=".16" filter="url(#shadow)"/>
  <!-- top face -->
  <path d="M140 54 L288 33 L304 23 L156 44 Z" fill="#f4f4f7"/>
  <!-- side face -->
  <path d="M288 33 L304 23 L304 303 L288 313 Z" fill="#cfcfd5"/>
  <!-- front face, skewed to show the angle -->
  <g transform="translate(118 54) skewY(-7)">
    <rect x="0" y="0" width="170" height="280" rx="22" fill="url(#front)" stroke="#d6d6dc" stroke-width="1.5"/>
    <path d="M22 2 H148" stroke="#ffffff" stroke-width="2" opacity=".9"/>
    <!-- light bar -->
    <rect x="30" y="16" width="110" height="6" rx="3" fill="#dcdce2"/>
    <rect x="30" y="16" width="64" height="6" rx="3" fill="url(#bar)"/>
    <!-- mode keys -->
    <g filter="url(#soft)">
      <rect x="18" y="34" width="40" height="30" rx="7" fill="url(#key)"/>
      <rect x="65" y="34" width="40" height="30" rx="7" fill="url(#key)"/>
      <rect x="112" y="34" width="40" height="30" rx="7" fill="url(#key)"/>
    </g>
    <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#34c759" transform="translate(29 40) scale(.75)"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></g>
      <g stroke="#ff9500" transform="translate(76 40) scale(.75)"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></g>
      <g stroke="#ff3b30" transform="translate(123 40) scale(.75)"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></g>
    </g>
    <!-- number keys -->
    <g filter="url(#soft)" fill="url(#key)">
      <rect x="18" y="84" width="40" height="30" rx="7"/><rect x="65" y="84" width="40" height="30" rx="7"/><rect x="112" y="84" width="40" height="30" rx="7"/>
      <rect x="18" y="130" width="40" height="30" rx="7"/><rect x="65" y="130" width="40" height="30" rx="7"/><rect x="112" y="130" width="40" height="30" rx="7"/>
      <rect x="18" y="176" width="40" height="30" rx="7"/><rect x="65" y="176" width="40" height="30" rx="7"/><rect x="112" y="176" width="40" height="30" rx="7"/>
      <rect x="18" y="222" width="40" height="30" rx="7"/><rect x="65" y="222" width="40" height="30" rx="7"/><rect x="112" y="222" width="40" height="30" rx="7"/>
    </g>
    <g font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2c2c2e" text-anchor="middle">
      <text x="38" y="104">1</text><text x="85" y="104">2</text><text x="132" y="104">3</text>
      <text x="38" y="150">4</text><text x="85" y="150">5</text><text x="132" y="150">6</text>
      <text x="38" y="196">7</text><text x="85" y="196">8</text><text x="132" y="196">9</text>
      <text x="85" y="242">0</text>
    </g>
    <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M32 231 l12 12 M44 231 l-12 12" stroke="#8e8e93"/>
      <path d="M125 238 l5 5 l10 -11" stroke="#34c759"/>
    </g>
    <!-- status dots -->
    <circle cx="60" cy="266" r="4" fill="#ff3b30"/><circle cx="85" cy="266" r="4" fill="#ff9500"/><circle cx="110" cy="266" r="4" fill="#0a84ff"/>
  </g>
</svg>
